name: Food101 Drift Retraining

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - drift-alert

jobs:

  drift-retraining:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # VERIFY MODEL FILES
      # ============================================================

      - name: Verify model files
        run: |
          echo "============================================"
          echo "CHECKING TRAINED MODEL"
          echo "============================================"

          ls -lh models/food101_model

          test -f models/food101_model/model.safetensors
          test -f models/food101_model/config.json
          test -f models/food101_model/preprocessor_config.json

          echo "Model files available."
          echo "============================================"


      # ============================================================
      # VERIFY DRIFT IMAGES
      # ============================================================

      - name: Verify drift images
        run: |
          echo "============================================"
          echo "CHECKING DRIFT DATASET"
          echo "============================================"

          COUNT=$(find data/drifted_images -type f -name "*.jpg" | wc -l)

          echo "Drift images: $COUNT"

          test "$COUNT" -eq 101

          echo "Drift dataset available."
          echo "============================================"


      # ============================================================
      # CREATE REFERENCE EMBEDDINGS
      # ============================================================

      - name: Create drift reference embeddings
        run: |
          echo "============================================"
          echo "CREATING DRIFT REFERENCE EMBEDDINGS"
          echo "============================================"

          python -m src.drift

          echo "Reference embeddings created."
          echo "============================================"


      # ============================================================
      # RUN SIMULATED DRIFT DETECTION
      # ============================================================

      - name: Run simulated drift detection
        run: |
          echo "============================================"
          echo "RUNNING SIMULATED DRIFT DETECTION"
          echo "============================================"

          python -m src.drift --drifted

          echo "Drift detection completed."
          echo "============================================"


      # ============================================================
      # CHECK DRIFT RESULT
      # ============================================================

      - name: Check drift result
        id: drift_check
        run: |
          python - <<'PY'
          import json
          import os

          with open("artifacts/drift_result.json") as f:
              result = json.load(f)

          print("============================================")
          print("FOOD-101 DRIFT RESULT")
          print("============================================")

          print("Dataset Type :", result["dataset_type"])
          print("Drift Score  :", result["drift_score"])
          print("Threshold    :", result["threshold"])
          print("Drift        :", result["drift_detected"])

          print("============================================")

          drift_detected = str(
              result["drift_detected"]
          ).lower()

          # Pass drift result to the next GitHub Actions step.
          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as output:

              output.write(
                  f"drift_detected={drift_detected}\n"
              )

          if result["drift_detected"]:

              print("DRIFT DETECTED!")
              print("Retraining is required.")

          else:

              print("NO DRIFT DETECTED")
              print("Retraining is not required.")

          PY


      # ============================================================
      # DISPLAY DRIFT ALERT
      # ============================================================

      - name: Drift detected
        if: steps.drift_check.outputs.drift_detected == 'true'
        run: |
          echo "============================================"
          echo "DRIFT DETECTED"
          echo "============================================"
          echo "The Food-101 input distribution has changed."
          echo "Starting model retraining..."
          echo "============================================"


      # ============================================================
      # TRIGGER MODEL RETRAINING
      # ============================================================

      - name: Trigger retraining
        if: steps.drift_check.outputs.drift_detected == 'true'
        run: |
          echo "============================================"
          echo "STARTING RETRAINING PIPELINE"
          echo "============================================"

          python -m src.retrain_trigger

          echo "============================================"
          echo "RETRAINING COMMAND FINISHED"
          echo "============================================"


      # ============================================================
      # NO DRIFT MESSAGE
      # ============================================================

      - name: No drift - skip retraining
        if: steps.drift_check.outputs.drift_detected != 'true'
        run: |
          echo "============================================"
          echo "NO DRIFT DETECTED"
          echo "============================================"
          echo "Retraining will be skipped."
          echo "The existing model remains unchanged."
          echo "============================================"


      # ============================================================
      # RETRAINING COMPLETED
      # ============================================================

      - name: Retraining completed
        if: steps.drift_check.outputs.drift_detected == 'true'
        run: |
          echo "============================================"
          echo "RETRAINING PIPELINE COMPLETED"
          echo "============================================"
          echo "Drift detection triggered model retraining."
          echo "ZenML retraining pipeline was executed."
          echo "MLflow logging was executed."
          echo "============================================"
