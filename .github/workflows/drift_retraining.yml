name: Food101 Drift Retraining

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - drift-alert

jobs:

  drift-retraining:

    runs-on: self-hosted

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # DISPLAY WORKFLOW INFORMATION
      # ============================================================

      - name: Display workflow information
        run: |
          echo "============================================"
          echo "FOOD-101 MLOPS PIPELINE"
          echo "============================================"
          echo "Workflow : ${{ github.workflow }}"
          echo "Event    : ${{ github.event_name }}"
          echo "Branch   : ${{ github.ref }}"
          echo "Commit   : ${{ github.sha }}"
          echo "============================================"


      # ============================================================
      # VERIFY MODEL
      # ============================================================

      - name: Verify model files
        run: |
          echo "============================================"
          echo "VERIFYING TRAINED MODEL"
          echo "============================================"

          ls -lh models/food101_model

          test -f models/food101_model/model.safetensors
          test -f models/food101_model/config.json
          test -f models/food101_model/preprocessor_config.json

          echo "Model files available."


      # ============================================================
      # VERIFY DRIFT DATA
      # ============================================================

      - name: Verify drift images
        run: |
          echo "============================================"
          echo "VERIFYING DRIFT DATASET"
          echo "============================================"

          COUNT=$(find data/drifted_images -type f -name "*.jpg" | wc -l)

          echo "Drift images: $COUNT"

          test "$COUNT" -eq 101

          echo "Drift dataset available."


      # ============================================================
      # CREATE REFERENCE EMBEDDINGS
      # ============================================================

      - name: Create drift reference embeddings
        run: |
          echo "============================================"
          echo "CREATING REFERENCE EMBEDDINGS"
          echo "============================================"

          python -m src.drift

          echo "Reference embeddings created."


      # ============================================================
      # RUN DRIFT DETECTION
      # ============================================================

      - name: Run simulated drift detection
        run: |
          echo "============================================"
          echo "RUNNING DRIFT DETECTION"
          echo "============================================"

          python -m src.drift --drifted

          echo "Drift detection completed."


      # ============================================================
      # CHECK DRIFT RESULT
      # ============================================================

      - name: Check drift result
        id: drift_check
        run: |
          python - <<'PY'
          import json
          import os

          with open("artifacts/drift_result.json") as f:
              result = json.load(f)

          dataset_type = result["dataset_type"]
          drift_score = float(result["drift_score"])
          threshold = float(result["threshold"])
          drift_detected = bool(result["drift_detected"])

          print("============================================")
          print("FOOD-101 DRIFT RESULT")
          print("============================================")
          print("Dataset Type :", dataset_type)
          print("Drift Score  :", drift_score)
          print("Threshold    :", threshold)
          print("Drift        :", drift_detected)
          print("============================================")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(
                  f"drift_detected={str(drift_detected).lower()}\n"
              )

              output.write(
                  f"drift_score={drift_score}\n"
              )

              output.write(
                  f"drift_threshold={threshold}\n"
              )

          if drift_detected:
              print("DRIFT DETECTED!")
              print("Retraining is required.")
          else:
              print("NO DRIFT DETECTED.")
              print("Retraining is not required.")
          PY


      # ============================================================
      # DISPLAY DRIFT ALERT
      # ============================================================

      - name: Drift detected
        if: steps.drift_check.outputs.drift_detected == 'true'
        run: |
          echo "============================================"
          echo "DRIFT DETECTED"
          echo "============================================"
          echo "Dataset type : simulated_drift"
          echo "Drift score  : ${{ steps.drift_check.outputs.drift_score }}"
          echo "Threshold    : ${{ steps.drift_check.outputs.drift_threshold }}"
          echo "Starting model retraining..."
          echo "============================================"


      # ============================================================
      # TRIGGER MODEL RETRAINING
      # ============================================================

      - name: Trigger retraining
        if: steps.drift_check.outputs.drift_detected == 'true'
        run: |
          echo "============================================"
          echo "STARTING RETRAINING PIPELINE"
          echo "============================================"

          python -m src.retrain_trigger

          echo "============================================"
          echo "RETRAINING COMMAND FINISHED"
          echo "============================================"


      # ============================================================
      # VERIFY RETRAINING OUTPUT
      # ============================================================

      - name: Verify retrained model
        if: steps.drift_check.outputs.drift_detected == 'true'
        run: |
          echo "============================================"
          echo "VERIFYING RETRAINED MODEL"
          echo "============================================"

          test -f models/food101_model/model.safetensors
          test -f models/food101_model/config.json
          test -f models/food101_model/preprocessor_config.json

          echo "Retrained model files are available."


      # ============================================================
      # RETRAINING COMPLETED
      # ============================================================

      - name: Retraining completed
        if: steps.drift_check.outputs.drift_detected == 'true'
        run: |
          echo "============================================"
          echo "RETRAINING PIPELINE COMPLETED"
          echo "============================================"
          echo "Drift detection triggered model retraining."
          echo "ZenML retraining pipeline was executed."
          echo "MLflow logging was executed."
          echo "Retrained model was generated."
          echo "============================================"


      # ============================================================
      # NO DRIFT
      # ============================================================

      - name: No drift - skip retraining
        if: steps.drift_check.outputs.drift_detected != 'true'
        run: |
          echo "============================================"
          echo "NO DRIFT DETECTED"
          echo "============================================"
          echo "Retraining will be skipped."
          echo "The existing model remains unchanged."
          echo "============================================"


      # ============================================================
      # FINAL PIPELINE STATUS
      # ============================================================

      - name: Pipeline summary
        if: always()
        run: |
          echo "============================================"
          echo "FOOD-101 MLOPS PIPELINE SUMMARY"
          echo "============================================"
          echo "Drift detected : ${{ steps.drift_check.outputs.drift_detected }}"
          echo "Drift score    : ${{ steps.drift_check.outputs.drift_score }}"
          echo "Threshold      : ${{ steps.drift_check.outputs.drift_threshold }}"
          echo "============================================"
